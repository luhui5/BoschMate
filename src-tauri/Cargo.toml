[package]
name = "boschmate"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.2"
rdev = "0.5"
winapi = { version = "0.3", features = ["winuser", "fileapi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = "0.19"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
dirs = "5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"], default-features = false }
htmd = "0.5"
url = "2"
urlencoding = "2"
html-escape = "0.2"
futures = "0.3"
ring = "0.17"
argon2 = "0.5"
keyring = "3"
# usearch = "2"  # Disabled: numkong C code fails on Windows MSVC
# ssh2 = "0.9"  # Disabled: vendored openssl build fails on Windows
rayon = "1"
tree-sitter = "0.23"
tree-sitter-rust = "0.21"
tauri-plugin-updater = "2"
notify = "6.1"
calamine = "0.26"
docx-rs = "0.4"
pdf-extract = "0.7"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
