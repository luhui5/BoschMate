name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: '10' }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx tauri build --ci
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoschMate-release
          path: src-tauri/target/release/bundle/
      # Code signing: configure TAURI_SIGNING_PRIVATE_KEY in repo secrets for production builds.
