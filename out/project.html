<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var id = params.get("id") || params.get("project")
        if (id) {
          location.replace("/?project=" + encodeURIComponent(id))
        } else {
          location.replace("/")
        }
      })()
    </script>
  </head>
  <body></body>
</html>
